[package]
name = "acop-hermes"
description = "acop codec: the `hermes` (Hermes Agent) conversation store (`~/.hermes` profile store — jsonl/json/text transcripts and sqlite containers decoded through the shared generic lane) — decode, encode, redact and import-path knowledge."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "acop_hermes"

[dependencies]
a4aa-hermes = "0.5.0"
acop.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
rusqlite = { version = "0.40", features = ["bundled"] }
