[package]
name = "acop-opencode"
description = "acop codec: the `opencode` (OpenCode) conversation store (`~/.local/share/opencode` data store — jsonl/json/text transcripts and sqlite containers decoded through the shared generic lane) — decode, encode, redact and import-path knowledge."
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "acop_opencode"

[dependencies]
a4aa-opencode = { path = "../../../Adapter-For-All-Agents/crates/a4aa-opencode", version = "0.4.1" }
acop.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"
rusqlite = { version = "0.40", features = ["bundled"] }
