[package]
name = "acop-cli"
description = "The `acop` binary: codec registry and command-line surface for Agent Context Operators."
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "acop"
path = "src/main.rs"

[dependencies]
acop.workspace = true
acop-antigravity = { path = "../acop-antigravity", version = "0.1.2" }
acop-claude = { path = "../acop-claude", version = "0.1.2" }
acop-codex = { path = "../acop-codex", version = "0.1.2" }
acop-copilot = { path = "../acop-copilot", version = "0.1.2" }
acop-cursor = { path = "../acop-cursor", version = "0.1.2" }
acop-dsh = { path = "../acop-dsh", version = "0.1.2" }
acop-hermes = { path = "../acop-hermes", version = "0.1.2" }
acop-kilo-code = { path = "../acop-kilo-code", version = "0.1.2" }
acop-kimi-code = { path = "../acop-kimi-code", version = "0.1.2" }
acop-openclaw = { path = "../acop-openclaw", version = "0.1.2" }
acop-opencode = { path = "../acop-opencode", version = "0.1.2" }
acop-pi = { path = "../acop-pi", version = "0.1.2" }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
