[package]
name = "acop-cli"
description = "The `aco` binary: codec registry and command-line surface for Agent Context Operators."
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aco"
path = "src/main.rs"

[dependencies]
acop.workspace = true
acop-antigravity = { path = "../aco-antigravity", version = "0.1.2" }
acop-claude = { path = "../aco-claude", version = "0.1.2" }
acop-codex = { path = "../aco-codex", version = "0.1.2" }
acop-copilot = { path = "../aco-copilot", version = "0.1.2" }
acop-cursor = { path = "../aco-cursor", version = "0.1.2" }
acop-dsh = { path = "../aco-dsh", version = "0.1.2" }
acop-hermes = { path = "../aco-hermes", version = "0.1.2" }
acop-kilo-code = { path = "../aco-kilo-code", version = "0.1.2" }
acop-kimi-code = { path = "../aco-kimi-code", version = "0.1.2" }
acop-openclaw = { path = "../aco-openclaw", version = "0.1.2" }
acop-opencode = { path = "../aco-opencode", version = "0.1.2" }
acop-pi = { path = "../aco-pi", version = "0.1.2" }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
