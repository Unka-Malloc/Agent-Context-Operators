[package]
name = "acop-openclaw"
description = "acop codec: the `openclaw` (OpenClaw) conversation store (`~/.openclaw` — jsonl/json/text transcripts and sqlite containers decoded through the shared generic lane) — decode, encode, redact and import-path knowledge."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "acop_openclaw"

