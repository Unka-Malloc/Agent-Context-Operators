[package]
name = "acop-kilo-code"
description = "acop codec: the `kilocode` (Kilo Code) conversation store (`~/.local/share/kilo/kilo.db` OpenCode-shaped sqlite `session`/`message`/`part` tables, generic sqlite probe fallback) — read-only enumerate, decode and redact knowledge."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "acop_kilo_code"

[dependencies]
a4aa-kilo-code = "0.5.0"
acop.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"
