[package]
name = "acop-antigravity"
description = "aco codec: the `antigravity` (Antigravity CLI) conversation store (`~/.gemini/antigravity-cli` — jsonl/json/text transcripts and sqlite containers decoded through the shared generic lane) — decode, encode, redact and import-path knowledge."
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "aco_antigravity"

[dependencies]
a4aa-antigravity = { path = "../../../Adapter-For-All-Agents/crates/a4aa-antigravity", version = "0.4.1" }
acop.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
rusqlite = { version = "0.40", features = ["bundled"] }
