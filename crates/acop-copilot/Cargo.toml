[package]
name = "acop-copilot"
description = "acop codec: the `copilot` (GitHub Copilot) conversation store (`~/.copilot` session-state `events.jsonl` transcripts, the `session-store.db` index, VS Code `state.vscdb` `chatSessions` rows) — decode, encode, redact and import-path knowledge."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "acop_copilot"

[dependencies]
a4aa-copilot = { path = "../../../Adapter-For-All-Agents/crates/a4aa-copilot", version = "0.5.0" }
acop.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"
