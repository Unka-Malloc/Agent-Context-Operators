[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Unka-Malloc/Agent-Context-Operators"

[workspace.dependencies]
acop = { path = "crates/acop", version = "0.2.0" }
acop-usage-core = { path = "crates/acop-usage-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "=0.10.9"

# The registry `a4aa-<agent>` cards build on `acop` themselves; resolving
# that requirement to this workspace's crate keeps one `acop::store`
# vocabulary in the graph, so a card's history is the codec's own type.
[patch.crates-io]
acop = { path = "crates/acop" }
