[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Unka-Malloc/ACOP"

[workspace.dependencies]
acop = { path = "crates/acop", version = "0.1.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
